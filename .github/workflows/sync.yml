name: Event-Driven Sync Upstream

on:
  repository_dispatch:
    types:
      - rss_release_update
  workflow_dispatch: # 留个手动备用按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Sync and Force Push from Upstream
        run: |
          # 1. 配置临时 Git 用户身份
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 2. 添加 XIU2 的原作者仓库作为远程源
          git remote add upstream https://github.com/XIU2/CloudflareSpeedTest.git
          
          # 3. 拉取原作者最新的所有数据
          git fetch upstream --tags
          
          # 4. 把原作者的主分支（master）强行覆盖到你自己的主分支（master）
          # 如果你的默认分支叫 main，请把下面的 master:master 改为 master:main
          git push upstream refs/remotes/upstream/master:refs/heads/master --force

          
